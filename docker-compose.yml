version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: car_dealership_mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch(e) { rs.initiate().ok }"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
    driver: local
