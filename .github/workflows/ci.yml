name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: cardealership
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      postgres_test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: cardealership_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Prisma Generate & Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/cardealership?schema=public
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5433/cardealership_test?schema=public
        run: |
          npx prisma generate
          DATABASE_URL=$DATABASE_URL npx prisma migrate deploy
          DATABASE_URL=$TEST_DATABASE_URL npx prisma migrate deploy

      - name: Backend Lint Check
        working-directory: ./backend
        run: npm run lint

      - name: Backend Unit & E2E Tests with Coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/cardealership?schema=public
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5433/cardealership_test?schema=public
          JWT_SECRET: ci-test-secret-key-at-least-32-characters
          JWT_EXPIRES_IN: 1d
        run: npm run test:cov

      - name: Backend Build
        working-directory: ./backend
        run: npm run build

  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Lint Check
        working-directory: ./frontend
        run: npm run lint

      - name: Frontend Vitest Suite
        working-directory: ./frontend
        run: npm run test:run

      - name: Frontend Production Build
        working-directory: ./frontend
        run: npm run build
