name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Prisma Generate & DB Push
        working-directory: ./backend
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/cardealership?directConnection=true
          TEST_DATABASE_URL: mongodb://127.0.0.1:27017/cardealership_test?directConnection=true
        run: |
          npx prisma generate
          DATABASE_URL=$DATABASE_URL npx prisma db push
          DATABASE_URL=$TEST_DATABASE_URL npx prisma db push

      - name: Backend Lint Check
        working-directory: ./backend
        run: npm run lint

      - name: Backend Unit Tests with Coverage
        working-directory: ./backend
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/cardealership?directConnection=true
          TEST_DATABASE_URL: mongodb://127.0.0.1:27017/cardealership_test?directConnection=true
          JWT_SECRET: ci-test-secret-key-at-least-32-characters
          JWT_EXPIRES_IN: 1d
        run: npm run test:cov

      - name: Backend Build
        working-directory: ./backend
        run: npm run build

  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Lint Check
        working-directory: ./frontend
        run: npm run lint

      - name: Frontend Vitest Suite
        working-directory: ./frontend
        run: npm run test:run

      - name: Frontend Production Build
        working-directory: ./frontend
        run: npm run build
